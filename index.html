<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Passthrough & Hand Interaction</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="ar-button">启动 WebXR AR 体验</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/XRControllerModelFactory.js"></script>

    <script>
        let camera, scene, renderer;
        let sphere, sphereOriginalPosition;
        let controller1, controller2;
        let hand1, hand2;
        let grabbedObject = null; // 当前被抓取的物体

        init();

        function init() {
            // 1. 创建场景
            scene = new THREE.Scene();

            // 2. 创建相机
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // 3. 创建渲染器 (必须启用 xr 和 alpha:true 以实现透视背景)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // 开启 WebXR 支持
            document.body.appendChild(renderer.domElement);

            // 4. 添加光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(0, 5, 2);
            scene.add(directionalLight);

            // 5. 创建一个可交互的球体 (放在正前方 1 米处)
            const geometry = new THREE.SphereGeometry(0.1, 32, 32); // 半径 10 厘米
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xff3333, 
                roughness: 0.3,
                metalness: 0.1 
            });
            sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(0, 1.2, -0.8); // 眼睛前方、略微偏下
            scene.add(sphere);
            
            // 记录初始位置，方便后续重置或计算
            sphereOriginalPosition = sphere.position.clone();

            // 6. 设置 WebXR 控制器与手部追踪
            setupControllers();

            // 7. AR 按钮逻辑
            const arButton = document.getElementById('ar-button');
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported) {
                        arButton.addEventListener('click', on激发ARSession);
                    } else {
                        arButton.textContent = '当前设备不支持 Immersive AR';
                        arButton.disabled = true;
                    }
                });
            } else {
                arButton.textContent = '浏览器不支持 WebXR';
                arButton.disabled = true;
            }

            window.addEventListener('resize', onWindowResize);
        }

        function on激发ARSession() {
            // 请求 AR 会话，启用环境光估计和手部输入
            const sessionInit = {
                requiredFeatures: ['hit-test', 'local-floor'],
                optionalFeatures: ['hand-tracking', 'passthrough', 'layers']
            };

            navigator.xr.requestSession('immersive-ar', sessionInit).then((session) => {
                renderer.xr.setSession(session);
                document.getElementById('overlay').style.display = 'none'; // 隐藏进入按钮

                session.addEventListener('end', () => {
                    document.getElementById('overlay').style.display = 'block';
                });
            });
        }

        function setupControllers() {
            // 控制器 1 (右手柄 / 右手)
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            controller1.addEventListener('selectend', onSelectEnd);
            scene.add(controller1);

            // 控制器 2 (左手柄 / 左手)
            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectend', onSelectEnd);
            scene.add(controller2);

            // 手部追踪支持 (Meta Quest Hand Tracking)
            hand1 = renderer.xr.getHand(0);
            hand1.addEventListener('pinchstart', onPinchStart);
            hand1.addEventListener('pinchend', onPinchEnd);
            scene.add(hand1);

            hand2 = renderer.xr.getHand(1);
            hand2.addEventListener('pinchstart', onPinchStart);
            hand2.addEventListener('pinchend', onPinchEnd);
            scene.add(hand2);
        }

        // 手柄触发（按下扳机键）
        function onSelectStart(event) {
            const controller = event.target;
            checkIntersectionAndGrab(controller);
        }

        // 手柄释放（松开扳机键）
        function onSelectEnd(event) {
            if (grabbedObject) {
                // 如果当前物体被该控制器抓取，则释放
                scene.attach(grabbedObject); // 放回世界场景
                grabbedObject = null;
            }
        }

        // 手部捏合开始（大拇指和食指捏合模拟抓取）
        function onPinchStart(event) {
            const hand = event.target;
            // 获取食指尖端位置用于检测
            const indexTip = hand.joints['index-finger-tip'];
            if (indexTip) {
                // 计算指尖与球体的距离
                const distance = indexTip.position.distanceTo(sphere.position);
                if (distance < 0.15 && !grabbedObject) {
                    grabbedObject = sphere;
                    hand.add(grabbedObject); // 将球体绑定到手上
                }
            }
        }

        // 手部捏合结束
        function onPinchEnd(event) {
            if (grabbedObject) {
                scene.attach(grabbedObject);
                grabbedObject = null;
            }
        }

        // 简单的距离检测抓取逻辑（针对标准手柄激光或直接触碰）
        function checkIntersectionAndGrab(source) {
            const distance = source.position.distanceTo(sphere.position);
            if (distance < 0.2 && !grabbedObject) {
                grabbedObject = sphere;
                source.add(grabbedObject); // 绑定到手柄上，实现拿起效果
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 渲染循环
        renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
