<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Experience</title>
    <style>
        :root {--primary-color: #2c3e50;--accent-color: #3498db;--text-color: #ffffff;}
        body {margin: 0;padding: 0;overflow: hidden;background-color: #000000;font-family: sans-serif;color: var(--text-color);user-select: none;}
        #ui-container {position: fixed;top: 0;left: 0;width: 100%;height: 100%;display: flex;flex-direction: column;justify-content: space-between;align-items: center;pointer-events: none;box-sizing: border-box;padding: 24px;z-index: 100;}
        .hud-panel {background: rgba(0, 0, 0, 0.65);backdrop-filter: blur(12px);border: 1px solid rgba(255, 255, 255, 0.15);border-radius: 16px;padding: 20px 32px;text-align: center;pointer-events: auto;}
        h1 {margin: 0 0 8px 0;font-size: 1.5rem;}
        p {margin: 0 0 16px 0;font-size: 0.95rem;color: #bdc3c7;}
        .xr-button {background: linear-gradient(135deg, var(--accent-color), #2980b9);color: var(--text-color);border: none;border-radius: 10px;padding: 14px 28px;font-size: 1rem;font-weight: 600;cursor: pointer;outline: none;}
        #status-bar {font-size: 0.85rem;color: #95a5a6;background: rgba(0, 0, 0, 0.4);padding: 8px 16px;border-radius: 20px;pointer-events: auto;}
        .hidden {display: none !important;}
    </style>
</head>
<body>
    <div id="ui-container">
        <div id="hud-panel" class="hud-panel">
            <h1>WebXR AR 射击</h1>
            <p id="instruction">请在 Meta Quest 浏览器中启动 AR 体验</p>
            <button id="xr-start-button" class="xr-button">启动 AR 体验</button>
        </div>
        <div id="status-bar">状态: 等待初始化</div>
    </div>
    <script src="./three.js/r128/three.min.js"></script>
    <script>
        const AppState = { scene: null, camera: null, renderer: null, targets: [], bullets: [], controllers: [], score: 0, scoreMesh: null, warningMesh: null };
        const Config = { sphereRadius: 0.08, colors: [0x3498db, 0xe74c3c, 0x2ecc71] };
        initApplication();
        function initApplication() {
            AppState.statusElement = document.getElementById('status-bar');
            AppState.panelElement = document.getElementById('hud-panel');
            AppState.scene = new THREE.Scene();
            AppState.camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
            AppState.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
            AppState.renderer.setSize(window.innerWidth, window.innerHeight);
            AppState.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            AppState.renderer.xr.enabled = true;
            document.body.appendChild(AppState.renderer.domElement);
            setupLighting();
            createEnvironment();
            setupXRControllers();
            setupXRSessionUI();
            window.addEventListener('resize', onWindowResize, false);
        }
        function setupLighting() {
            AppState.scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(1, 4, 2);
            AppState.scene.add(directionalLight);
        }
        function createEnvironment() {
            const geometry = new THREE.SphereGeometry(Config.sphereRadius, 32, 32);
            for (let i = 0; i < 3; i++) {
                const material = new THREE.MeshStandardMaterial({ color: Config.colors[i], roughness: 0.2, metalness: 0.3 });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set((i - 1) * 0.4, 1.2, -1.2);
                AppState.scene.add(mesh);
                AppState.targets.push(mesh);
            }
            AppState.warningMesh = createTextSprite("请拿起手柄");
            AppState.warningMesh.position.set(0, 1.6, -1.0);
            AppState.warningMesh.visible = false;
            AppState.scene.add(AppState.warningMesh);
            AppState.scoreMesh = createTextSprite("得分: 0");
            AppState.scoreMesh.position.set(0, 2.0, -1.2);
            AppState.scene.add(AppState.scoreMesh);
        }
        function createTextSprite(message) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 128;
            context.fillStyle = 'rgba(0, 0, 0, 0.6)';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.font = 'Bold 48px sans-serif';
            context.fillStyle = 'white';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(message, canvas.width / 2, canvas.height / 2);
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, depthWrite: false });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(0.6, 0.15, 1);
            return sprite;
        }
        function updateScoreTexture() {
            const canvas = AppState.scoreMesh.material.map.image;
            const context = canvas.getContext('2d');
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.fillStyle = 'rgba(0, 0, 0, 0.6)';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.font = 'Bold 48px sans-serif';
            context.fillStyle = 'white';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(`得分: ${AppState.score}`, canvas.width / 2, canvas.height / 2);
            AppState.scoreMesh.material.map.needsUpdate = true;
        }
        function setupXRControllers() {
            for (let i = 0; i < 2; i++) {
                const controller = AppState.renderer.xr.getController(i);
                controller.addEventListener('selectstart', onControllerSelectStart);
                AppState.scene.add(controller);
                AppState.controllers.push(controller);
                const marker = new THREE.Mesh(new THREE.SphereGeometry(0.015, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                controller.add(marker);
            }
        }
        function setupXRSessionUI() {
            const startButton = document.getElementById('xr-start-button');
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported) {
                        startButton.textContent = '启动 AR 体验';
                        startButton.disabled = false;
                        startButton.addEventListener('click', requestARSession);
                    } else {
                        startButton.disabled = true;
                    }
                });
            }
        }
        function requestARSession() {
            const sessionInit = { requiredFeatures: ['local-floor'], optionalFeatures: ['hand-tracking', 'passthrough', 'hit-test'] };
            navigator.xr.requestSession('immersive-ar', sessionInit).then(onSessionStarted);
        }
        function onSessionStarted(session) {
            AppState.renderer.xr.setSession(session);
            AppState.panelElement.classList.add('hidden');
            session.addEventListener('end', () => { AppState.panelElement.classList.remove('hidden'); });
        }
        function onControllerSelectStart(event) {
            const controller = event.target;
            const bulletGeo = new THREE.SphereGeometry(0.02, 16, 16);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            bullet.position.copy(controller.position);
            const quaternion = new THREE.Quaternion();
            controller.getWorldQuaternion(quaternion);
            const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(quaternion);
            bullet.userData = { velocity: direction.multiplyScalar(5.0) };
            AppState.scene.add(bullet);
            AppState.bullets.push(bullet);
        }
        function onWindowResize() {
            AppState.camera.aspect = window.innerWidth / window.innerHeight;
            AppState.camera.updateProjectionMatrix();
            AppState.renderer.setSize(window.innerWidth, window.innerHeight);
        }
        const clock = new THREE.Clock();
        AppState.renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            let controllersConnected = false;
            AppState.controllers.forEach(controller => {
                const inputSource = controller.userData.inputSource;
                if (controller.visible || controller.children.length > 0) { controllersConnected = true; }
            });
            if (AppState.warningMesh) {
                AppState.warningMesh.visible = !controllersConnected && AppState.renderer.xr.isPresenting;
            }
            for (let i = AppState.bullets.length - 1; i >= 0; i--) {
                const bullet = AppState.bullets[i];
                bullet.position.addScaledVector(bullet.userData.velocity, delta);
                for (let j = 0; j < AppState.targets.length; j++) {
                    const target = AppState.targets[j];
                    if (bullet.position.distanceTo(target.position) < Config.sphereRadius + 0.02) {
                        AppState.score += 10;
                        updateScoreTexture();
                        target.position.set((Math.random() - 0.5) * 0.8, 1.0 + Math.random() * 0.5, -0.8 - Math.random() * 0.8);
                        AppState.scene.remove(bullet);
                        AppState.bullets.splice(i, 1);
                        break;
                    }
                }
            }
            AppState.renderer.render(AppState.scene, AppState.camera);
        });
    </script>
</body>
</html>
