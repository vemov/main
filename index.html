<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Environment</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
        }

        #ui-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            box-sizing: border-box;
            padding: 24px;
            z-index: 100;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px 32px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        p {
            margin: 0 0 16px 0;
            font-size: 0.95rem;
            color: #bdc3c7;
        }

        .xr-button {
            background: linear-gradient(135deg, var(--accent-color), #2980b9);
            color: var(--text-color);
            border: none;
            border-radius: 10px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .xr-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.6);
        }

        .xr-button:active {
            transform: translateY(1px);
        }

        #status-bar {
            font-size: 0.85rem;
            color: #95a5a6;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div id="hud-panel" class="hud-panel">
            <h1>WebXR AR Experience</h1>
            <p id="instruction">请在 Meta Quest 浏览器中启动 AR 体验</p>
            <button id="xr-start-button" class="xr-button">启动 AR 体验</button>
        </div>
        <div id="status-bar">状态: 等待初始化</div>
    </div>

    <script src="./three.js/r128/three.min.js"></script>

    <script>
        const AppState = {
            scene: null,
            camera: null,
            renderer: null,
            interactiveObjects: [],
            controllers: [],
            hands: [],
            grabbedMap: new Map(),
            statusElement: null,
            panelElement: null
        };

        const Config = {
            sphereRadius: 0.08,
            grabDistanceThreshold: 0.2,
            colors: [0x3498db, 0xe74c3c, 0x2ecc71]
        };

        initApplication();

        function initApplication() {
            AppState.statusElement = document.getElementById('status-bar');
            AppState.panelElement = document.getElementById('hud-panel');

            AppState.scene = new THREE.Scene();
            AppState.camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);

            AppState.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
            AppState.renderer.setSize(window.innerWidth, window.innerHeight);
            AppState.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            AppState.renderer.xr.enabled = true;
            document.body.appendChild(AppState.renderer.domElement);

            setupLighting();
            createInteractiveObjects();
            setupXRControllers();
            setupXRSessionUI();

            window.addEventListener('resize', onWindowResize, false);
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            AppState.scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(1, 4, 2);
            AppState.scene.add(directionalLight);
        }

        function createInteractiveObjects() {
            const geometry = new THREE.SphereGeometry(Config.sphereRadius, 32, 32);
            
            for (let i = 0; i < 3; i++) {
                const material = new THREE.MeshStandardMaterial({
                    color: Config.colors[i],
                    roughness: 0.2,
                    metalness: 0.3
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set((i - 1) * 0.25, 1.2, -0.8);
                
                mesh.userData = {
                    isInteractive: true,
                    originalPosition: mesh.position.clone()
                };

                AppState.scene.add(mesh);
                AppState.interactiveObjects.push(mesh);
            }
        }

        function setupXRControllers() {
            for (let i = 0; i < 2; i++) {
                const controller = AppState.renderer.xr.getController(i);
                controller.addEventListener('selectstart', onControllerSelectStart);
                controller.addEventListener('selectend', onControllerSelectEnd);
                AppState.scene.add(controller);
                AppState.controllers.push(controller);

                // 使用内置简单小球代表手柄位置，避免加载外部模型报错
                const controllerMarker = new THREE.Mesh(
                    new THREE.SphereGeometry(0.015, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                controller.add(controllerMarker);

                const hand = AppState.renderer.xr.getHand(i);
                hand.addEventListener('pinchstart', onHandPinchStart);
                hand.addEventListener('pinchend', onHandPinchEnd);
                AppState.scene.add(hand);
                AppState.hands.push(hand);
            }
        }

        function setupXRSessionUI() {
            const startButton = document.getElementById('xr-start-button');

            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported) {
                        startButton.textContent = '启动 AR 体验';
                        startButton.disabled = false;
                        startButton.addEventListener('click', requestARSession);
                        updateStatus('设备支持 WebXR AR 模式');
                    } else {
                        updateStatus('当前设备不支持 Immersive AR 模式');
                        startButton.disabled = true;
                    }
                }).catch(() => {
                    updateStatus('XR 权限检测失败');
                });
            } else {
                updateStatus('当前浏览器不支持 WebXR API');
                startButton.disabled = true;
            }
        }

        function requestARSession() {
            const sessionInit = {
                requiredFeatures: ['local-floor'],
                optionalFeatures: ['hand-tracking', 'passthrough', 'hit-test']
            };

            navigator.xr.requestSession('immersive-ar', sessionInit).then(onSessionStarted).catch((err) => {
                console.error(err);
                updateStatus('AR 会话请求被拒绝或失败');
            });
        }

        function onSessionStarted(session) {
            AppState.renderer.xr.setSession(session);
            AppState.panelElement.classList.add('hidden');
            updateStatus('AR 会话运行中');

            session.addEventListener('end', () => {
                AppState.panelElement.classList.remove('hidden');
                updateStatus('会话已结束');
                AppState.grabbedMap.clear();
            });
        }

        function onControllerSelectStart(event) {
            const controller = event.target;
            const targetObject = findClosestInteractiveObject(controller.position, Config.grabDistanceThreshold);
            
            if (targetObject && !AppState.grabbedMap.has(controller)) {
                AppState.grabbedMap.set(controller, targetObject);
                controller.add(targetObject);
                targetObject.position.set(0, 0, 0);
                updateStatus('已抓取物体');
            }
        }

        function onControllerSelectEnd(event) {
            releaseObject(event.target);
        }

        function onHandPinchStart(event) {
            const hand = event.target;
            const indexTip = hand.joints['index-finger-tip'];
            
            if (indexTip) {
                const targetObject = findClosestInteractiveObject(indexTip.position, Config.grabDistanceThreshold);
                if (targetObject && !AppState.grabbedMap.has(hand)) {
                    AppState.grabbedMap.set(hand, targetObject);
                    hand.add(targetObject);
                    targetObject.position.set(0, 0, 0);
                    updateStatus('手部已捏取物体');
                }
            }
        }

        function onHandPinchEnd(event) {
            releaseObject(event.target);
        }

        function findClosestInteractiveObject(sourcePosition, maxDistance) {
            let closest = null;
            let minDistance = maxDistance;

            for (const obj of AppState.interactiveObjects) {
                const worldPos = new THREE.Vector3();
                obj.getWorldPosition(worldPos);
                const distance = sourcePosition.distanceTo(worldPos);
                
                if (distance < minDistance) {
                    minDistance = distance;
                    closest = obj;
                }
            }
            return closest;
        }

        function releaseObject(source) {
            if (AppState.grabbedMap.has(source)) {
                const obj = AppState.grabbedMap.get(source);
                AppState.scene.attach(obj);
                AppState.grabbedMap.delete(source);
                updateStatus('已释放物体');
            }
        }

        function updateStatus(message) {
            if (AppState.statusElement) {
                AppState.statusElement.textContent = `状态: ${message}`;
            }
        }

        function onWindowResize() {
            AppState.camera.aspect = window.innerWidth / window.innerHeight;
            AppState.camera.updateProjectionMatrix();
            AppState.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        AppState.renderer.setAnimationLoop(() => {
            AppState.renderer.render(AppState.scene, AppState.camera);
        });
    </script>
</body>
</html>
